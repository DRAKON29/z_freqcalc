# Клиентский режим (ТЗ 6.2): только frontend; карты ITU пользователь загружает в IndexedDB
# Запуск: docker compose -f deploy/docker-compose.wasm.yml up -d --build

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_MODEL_BACKEND: wasm
    container_name: radio-frontend-wasm
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
