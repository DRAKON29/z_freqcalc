# Гибридный режим (ТЗ 6.1): frontend + backend
# Запуск: docker compose -f deploy/docker-compose.yml up -d --build
# Обратный прокси (1Panel OpenResty) см. openresty.conf: /api → backend:8000, / → frontend:3000

services:
  backend:
    # Образ публикуется CI после прохождения всех проверок (ghcr.io);
    # build: сохранён для локальной сборки без CI
    image: ghcr.io/drakon29/z_freqcalc-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: radio-backend
    restart: unless-stopped
    environment:
      RADIO_DATA_DIR: /data
      RADIO_CORS_ORIGINS: "*"
      RADIO_RATE_CALC: "60"
      RADIO_RATE_UPLOAD: "10"
    volumes:
      - ../data/itu_maps:/data/itu_maps
      - ../data/clutter:/data/clutter
      - ../data/history:/data/history
      - ../data/srtm:/data/srtm
      - ../data/p452:/data/p452
      - ../data/p452_maps:/data/p452_maps
      - ../data/p2001:/data/p2001
      - ../data/p2001_maps:/data/p2001_maps
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: ghcr.io/drakon29/z_freqcalc-frontend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_MODEL_BACKEND: http
        NEXT_PUBLIC_API_BASE: /api
    container_name: radio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
