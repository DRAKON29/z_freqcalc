# Конфиг обратного прокси OpenResty/1Panel (ТЗ 6.1):
#   /api → backend:8000, / → frontend:3000
# HTTPS настраивается в 1Panel (Let's Encrypt) поверх этого сервера.
# Положить в /usr/local/openresty/nginx/conf/conf.d/radio-calc.conf

upstream radio_frontend {
    server frontend:3000;
}

upstream radio_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name radio.example.ru;

    # Размер тела для загрузки карт ITU (лимит ТЗ 5.1: 1 ГБ на zip)
    client_max_body_size 1100m;

    # API → Python-сервис
    location /api/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Ресайз/таймауты под WASM-PWA
        add_header X-Content-Type-Options nosniff always;
    }

    # Приложение → Next.js
    location / {
        proxy_pass http://radio_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS (ТЗ 3.4): терминация в 1Panel — Let's Encrypt; после выпуска сертификата:
#   listen 443 ssl http2;
#   ssl_certificate     /path/fullchain.pem;
#   ssl_certificate_key /path/privkey.pem;
#   и редирект 80 → 443.
