name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Lint
        run: bun run lint
      - name: Unit tests (TS core)
        run: bun test tests/

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: pip install -r mini-services/radio-service/requirements.txt pytest
      - name: Unit tests (formulas)
        working-directory: mini-services/radio-service
        run: python3 -m pytest tests/ -q
